<?xml version="1.0" encoding="UTF-8"?>
<!--
  Control-panel nav mask: the ray gun on its own, black on transparent, no tile.

  The geometry is lifted verbatim from src/icon.svg — these are the paths it fills in #fcfefb,
  which is to say the gun. The red detail paths (p6, p7, p9, p12 there) are deliberately NOT
  included: they sit inside the body path and already render as holes in it, which is what keeps
  the barrel ridges and the trigger guard open.

  **No stroke.** The icon welds these shapes together with a 10pt stroke, and carried over here it
  fuses the barrel rings, the muzzle and the trigger guard into one blob that reads as a hair
  dryer at 18px. The fills alone keep the segments apart. The gun is correspondingly lighter than
  the icon's, which is right for a nav glyph.

  The transform maps the fill-only bounds (46.99, 73.88, 175.02 x 122.72 in the icon's own frame)
  into a 92-unit box centred in 100x100 — the footprint the megaphone mask had before it.
-->
